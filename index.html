<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>腾讯地图定位示例</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #dde3ef;
      box-shadow: 0 2px 12px rgb(22 34 51 / 8%);
      z-index: 2;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    input {
      width: min(360px, 38vw);
      height: 38px;
      border: 1px solid #c9d3e2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #172033;
      outline: none;
    }

    input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgb(23 105 224 / 14%);
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    #status {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #516070;
      overflow-wrap: anywhere;
    }

    button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #1769e0;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #edf2f8;
      color: #1f2d3d;
    }

    button:disabled {
      cursor: progress;
      opacity: .72;
    }

    #map {
      width: 100%;
      min-height: 520px;
      height: calc(100vh - 76px);
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      input {
        width: 100%;
      }

      button {
        width: 100%;
      }

      #map {
        height: calc(100vh - 128px);
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>腾讯地图定位示例</h1>
      <p id="status">输入腾讯地图 Key 后加载地图。</p>
    </div>
    <form class="controls" id="keyForm">
      <input id="apiKeyInput" type="text" autocomplete="off" placeholder="腾讯地图 Key">
      <button class="secondary" id="loadMapBtn" type="submit">加载地图</button>
      <button id="locateBtn" type="button" disabled>定位到我</button>
    </form>
  </header>

  <main id="map" aria-label="腾讯地图"></main>

  <script>
    const fallbackCenter = { latitude: 39.98412, longitude: 116.30748 };
    const keyForm = document.getElementById("keyForm");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const loadMapBtn = document.getElementById("loadMapBtn");
    const statusEl = document.getElementById("status");
    const locateBtn = document.getElementById("locateBtn");
    let map = null;
    let marker = null;
    let currentKey = "";

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function getSavedKey() {
      const urlKey = new URLSearchParams(window.location.search).get("key");
      return urlKey || localStorage.getItem("tencent-map-demo-key") || "";
    }

    function loadTencentMapScript(key) {
      return new Promise((resolve, reject) => {
        if (window.TMap) {
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.src = `https://map.qq.com/api/gljs?v=1.exp&key=${encodeURIComponent(key)}`;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("腾讯地图脚本加载失败"));
        document.head.appendChild(script);
      });
    }

    async function initMap(event) {
      event?.preventDefault();
      const key = apiKeyInput.value.trim();

      if (!key) {
        setStatus("缺少腾讯地图 Key，地图未加载。");
        return;
      }

      loadMapBtn.disabled = true;
      setStatus("正在加载腾讯地图。");

      try {
        currentKey = key;
        localStorage.setItem("tencent-map-demo-key", key);
        await loadTencentMapScript(key);

        if (!map) {
          const center = new TMap.LatLng(fallbackCenter.latitude, fallbackCenter.longitude);
          map = new TMap.Map(document.getElementById("map"), {
            center,
            zoom: 13,
            pitch: 0,
            rotation: 0,
          });

          marker = new TMap.MultiMarker({
            map,
            geometries: [],
          });
        }

        locateBtn.disabled = false;
        setStatus("地图已加载，点击“定位到我”开始获取当前位置。");
      } catch (error) {
        setStatus(`地图加载失败：${error.message}。`);
      } finally {
        loadMapBtn.disabled = false;
      }
    }

    function updateMarker(position) {
      marker.setGeometries([
        {
          id: "current-location",
          position,
        },
      ]);
      map.setCenter(position);
      map.setZoom(16);
    }

    function requestJsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName = `qqMapCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          output: "jsonp",
          callback: callbackName,
        });

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("网络请求失败"));
        };

        script.src = `${url}?${query}`;
        document.body.appendChild(script);
      });
    }

    async function reverseGeocode(latitude, longitude) {
      const data = await requestJsonp("https://apis.map.qq.com/ws/geocoder/v1/", {
        location: `${latitude},${longitude}`,
        key: currentKey,
        get_poi: "0",
      });

      if (data.status !== 0) {
        throw new Error(data.message || "逆地址解析失败");
      }

      return data.result.address;
    }

    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("当前浏览器不支持定位能力"));
          return;
        }

        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0,
        });
      });
    }

    async function locateMe() {
      if (!map || !marker) {
        setStatus("地图未加载，先加载地图。");
        return;
      }

      locateBtn.disabled = true;
      setStatus("正在请求浏览器定位授权。");

      try {
        const { coords } = await getCurrentPosition();
        const position = new TMap.LatLng(coords.latitude, coords.longitude);
        updateMarker(position);

        setStatus(`已定位：纬度 ${coords.latitude.toFixed(6)}，经度 ${coords.longitude.toFixed(6)}。正在解析地址。`);

        try {
          const address = await reverseGeocode(coords.latitude, coords.longitude);
          setStatus(`已定位：${address}，纬度 ${coords.latitude.toFixed(6)}，经度 ${coords.longitude.toFixed(6)}。`);
        } catch (error) {
          setStatus(`已定位坐标，地址解析未完成：${error.message}。`);
        }
      } catch (error) {
        setStatus(`定位失败：${error.message || "浏览器拒绝或无法获取当前位置"}。`);
      } finally {
        locateBtn.disabled = false;
      }
    }

    const savedKey = getSavedKey();
    if (savedKey) {
      apiKeyInput.value = savedKey;
      initMap();
    }

    keyForm.addEventListener("submit", initMap);
    locateBtn.addEventListener("click", locateMe);
  </script>
</body>
</html>
