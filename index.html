<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地图定位示例</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #dde3ef;
      box-shadow: 0 2px 12px rgb(22 34 51 / 8%);
      z-index: 2;
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    #status {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #516070;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    select,
    input {
      height: 38px;
      border: 1px solid #c9d3e2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #172033;
      background: #ffffff;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgb(23 105 224 / 14%);
    }

    select {
      width: 118px;
    }

    .coordinate-select {
      width: 156px;
    }

    input {
      width: min(300px, 28vw);
    }

    .hidden {
      display: none;
    }

    button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #1769e0;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #edf2f8;
      color: #1f2d3d;
    }

    button:disabled {
      cursor: progress;
      opacity: .72;
    }

    #map {
      width: 100%;
      min-height: 520px;
      height: calc(100vh - 76px);
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      select,
      input,
      button {
        width: 100%;
      }

      #map {
        height: calc(100vh - 220px);
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>地图定位示例</h1>
      <p id="status">选择地图服务并输入运行时 Key 后加载地图，默认转 GCJ-02。</p>
    </div>
    <form class="controls" id="keyForm">
      <select id="providerSelect" aria-label="地图服务">
        <option value="tencent">腾讯地图</option>
        <option value="amap">高德地图</option>
      </select>
      <select class="coordinate-select" id="coordinateModeSelect" aria-label="坐标模式">
        <option value="gcj">转 GCJ-02</option>
        <option value="raw">原始坐标</option>
      </select>
      <input id="apiKeyInput" type="text" autocomplete="off" placeholder="地图 Key">
      <input class="hidden" id="amapSecurityInput" type="text" autocomplete="off" placeholder="高德安全密钥，可选">
      <button class="secondary" id="loadMapBtn" type="submit">加载地图</button>
      <button id="locateBtn" type="button" disabled>定位到我</button>
    </form>
  </header>

  <main id="map" aria-label="地图"></main>

  <script>
    const fallbackCenter = { latitude: 39.98412, longitude: 116.30748 };
    const LOCATION_TIMEOUT_MS = 15000;
    const MAX_LOCATION_SAMPLES = 8;
    const TARGET_ACCURACY_METERS = 35;
    const LOCATION_OPTIONS = {
      enableHighAccuracy: true,
      timeout: LOCATION_TIMEOUT_MS,
      maximumAge: 0,
    };
    const GCJ_PI = 3.14159265358979324;
    const GCJ_A = 6378245.0;
    const GCJ_EE = 0.00669342162296594323;
    const keyForm = document.getElementById("keyForm");
    const providerSelect = document.getElementById("providerSelect");
    const coordinateModeSelect = document.getElementById("coordinateModeSelect");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const amapSecurityInput = document.getElementById("amapSecurityInput");
    const loadMapBtn = document.getElementById("loadMapBtn");
    const statusEl = document.getElementById("status");
    const locateBtn = document.getElementById("locateBtn");
    const mapEl = document.getElementById("map");

    let map = null;
    let marker = null;
    let geocoder = null;
    let loadedProvider = "";
    let currentKey = "";
    let AMapApi = null;
    let lastLocationResult = null;

    const providers = {
      tencent: {
        label: "腾讯地图",
        keyStorage: "tencent-map-demo-key",
        placeholder: "腾讯地图 Key",
      },
      amap: {
        label: "高德地图",
        keyStorage: "amap-map-demo-key",
        securityStorage: "amap-map-demo-security",
        placeholder: "高德 Web端(JS API) Key",
      },
    };

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function formatAccuracy(accuracy) {
      if (!Number.isFinite(accuracy)) {
        return "未知";
      }

      return accuracy >= 1000 ? `${(accuracy / 1000).toFixed(2)} 千米` : `${Math.round(accuracy)} 米`;
    }

    function outOfChina(latitude, longitude) {
      return longitude < 72.004 || longitude > 137.8347 || latitude < 0.8293 || latitude > 55.8271;
    }

    function transformLatitude(x, y) {
      let result = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      result += (20.0 * Math.sin(6.0 * x * GCJ_PI) + 20.0 * Math.sin(2.0 * x * GCJ_PI)) * 2.0 / 3.0;
      result += (20.0 * Math.sin(y * GCJ_PI) + 40.0 * Math.sin(y / 3.0 * GCJ_PI)) * 2.0 / 3.0;
      result += (160.0 * Math.sin(y / 12.0 * GCJ_PI) + 320 * Math.sin(y * GCJ_PI / 30.0)) * 2.0 / 3.0;
      return result;
    }

    function transformLongitude(x, y) {
      let result = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      result += (20.0 * Math.sin(6.0 * x * GCJ_PI) + 20.0 * Math.sin(2.0 * x * GCJ_PI)) * 2.0 / 3.0;
      result += (20.0 * Math.sin(x * GCJ_PI) + 40.0 * Math.sin(x / 3.0 * GCJ_PI)) * 2.0 / 3.0;
      result += (150.0 * Math.sin(x / 12.0 * GCJ_PI) + 300.0 * Math.sin(x / 30.0 * GCJ_PI)) * 2.0 / 3.0;
      return result;
    }

    function wgs84ToGcj02(latitude, longitude) {
      if (outOfChina(latitude, longitude)) {
        return { latitude, longitude, converted: false };
      }

      let deltaLatitude = transformLatitude(longitude - 105.0, latitude - 35.0);
      let deltaLongitude = transformLongitude(longitude - 105.0, latitude - 35.0);
      const radLatitude = latitude / 180.0 * GCJ_PI;
      let magic = Math.sin(radLatitude);
      magic = 1 - GCJ_EE * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      deltaLatitude = (deltaLatitude * 180.0) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * GCJ_PI);
      deltaLongitude = (deltaLongitude * 180.0) / (GCJ_A / sqrtMagic * Math.cos(radLatitude) * GCJ_PI);

      return {
        latitude: latitude + deltaLatitude,
        longitude: longitude + deltaLongitude,
        converted: true,
      };
    }

    function selectedProvider() {
      return providerSelect.value;
    }

    function selectedCoordinateMode() {
      return coordinateModeSelect.value;
    }

    function initialCoordinateMode() {
      const mode = queryParams().get("coordinate");
      return mode === "raw" || mode === "gcj" ? mode : "gcj";
    }

    function queryParams() {
      return new URLSearchParams(window.location.search);
    }

    function scriptExists(id) {
      return Boolean(document.getElementById(id));
    }

    function loadScript(id, src) {
      return new Promise((resolve, reject) => {
        if (scriptExists(id)) {
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.id = id;
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("地图脚本加载失败"));
        document.head.appendChild(script);
      });
    }

    function getRuntimeKey(provider) {
      const params = queryParams();
      const queryKey = params.get(`${provider}Key`) || params.get("key");
      return queryKey || localStorage.getItem(providers[provider].keyStorage) || "";
    }

    function getAmapSecurityCode() {
      const params = queryParams();
      return params.get("amapSecurityJsCode") || localStorage.getItem(providers.amap.securityStorage) || "";
    }

    function syncProviderFields() {
      const provider = selectedProvider();
      const config = providers[provider];
      apiKeyInput.placeholder = config.placeholder;
      apiKeyInput.value = getRuntimeKey(provider);
      amapSecurityInput.classList.toggle("hidden", provider !== "amap");
      amapSecurityInput.value = provider === "amap" ? getAmapSecurityCode() : "";
      locateBtn.disabled = true;
      setStatus(`输入${config.label} Key 后加载地图。`);
    }

    function sourceQualityText(accuracy) {
      if (!Number.isFinite(accuracy)) {
        return "浏览器未返回误差半径，无法判断定位源质量";
      }

      if (accuracy > 1000) {
        return "当前更像粗定位，通常来自 IP、Wi-Fi 或桌面浏览器位置源";
      }

      if (accuracy > 100) {
        return "当前精度一般，移动到开阔处或使用手机定位会更稳";
      }

      return "当前定位源精度较好";
    }

    function getMapCoordinates(sourceCoords) {
      if (selectedCoordinateMode() === "gcj") {
        return wgs84ToGcj02(sourceCoords.latitude, sourceCoords.longitude);
      }

      return {
        latitude: sourceCoords.latitude,
        longitude: sourceCoords.longitude,
        converted: false,
      };
    }

    function coordinateModeText(mapCoords) {
      if (selectedCoordinateMode() === "gcj") {
        return mapCoords.converted ? "已按 WGS84 -> GCJ-02 转换" : "当前坐标不在国内转换范围，保留原始坐标";
      }

      return "使用浏览器返回的原始坐标";
    }

    function buildDiagnosticText(sourceCoords, mapCoords, samples) {
      return [
        `已采样 ${samples} 次`,
        `误差约 ${formatAccuracy(sourceCoords.accuracy)}`,
        coordinateModeText(mapCoords),
        `原始坐标 ${sourceCoords.latitude.toFixed(6)}，${sourceCoords.longitude.toFixed(6)}`,
        `地图坐标 ${mapCoords.latitude.toFixed(6)}，${mapCoords.longitude.toFixed(6)}`,
        sourceQualityText(sourceCoords.accuracy),
      ].join("。");
    }

    function resetMap() {
      if (map && typeof map.destroy === "function") {
        map.destroy();
      }

      map = null;
      marker = null;
      geocoder = null;
      AMapApi = null;
      lastLocationResult = null;
      mapEl.innerHTML = "";
      locateBtn.disabled = true;
      loadedProvider = "";
    }

    function rememberRuntimeValues(provider, key) {
      localStorage.setItem("map-demo-provider", provider);
      localStorage.setItem(providers[provider].keyStorage, key);

      if (provider === "amap") {
        const securityCode = amapSecurityInput.value.trim();
        if (securityCode) {
          localStorage.setItem(providers.amap.securityStorage, securityCode);
        }
      }
    }

    async function loadTencentMap(key) {
      await loadScript(
        "tencent-map-js",
        `https://map.qq.com/api/gljs?v=1.exp&key=${encodeURIComponent(key)}`
      );
    }

    async function loadAmap(key) {
      const securityCode = amapSecurityInput.value.trim();
      if (securityCode) {
        window._AMapSecurityConfig = { securityJsCode: securityCode };
      }

      await loadScript(
        "amap-loader-js",
        "https://webapi.amap.com/loader.js"
      );

      try {
        AMapApi = await window.AMapLoader.load({
          key,
          version: "2.0",
          plugins: ["AMap.Geocoder"],
        });
      } catch (error) {
        const message = String(error?.message || error);
        if (message.includes("USERKEY_PLAT_NOMATCH")) {
          throw new Error("高德 Key 平台类型不匹配，请使用 Web端(JS API) Key");
        }

        if (message.includes("INVALID_USER_SCODE")) {
          throw new Error("高德安全密钥未通过验证，请填写与该 Key 匹配的安全密钥");
        }

        throw new Error(message || "高德地图加载失败");
      }
    }

    function createTencentMap() {
      const center = new TMap.LatLng(fallbackCenter.latitude, fallbackCenter.longitude);
      map = new TMap.Map(mapEl, {
        center,
        zoom: 13,
        pitch: 0,
        rotation: 0,
      });

      marker = new TMap.MultiMarker({
        map,
        geometries: [],
      });
    }

    function createAmap() {
      const center = [fallbackCenter.longitude, fallbackCenter.latitude];
      map = new AMapApi.Map("map", {
        center,
        zoom: 13,
        resizeEnable: true,
      });

      marker = new AMapApi.Marker({
        position: center,
      });
      map.add(marker);
      marker.hide();
      geocoder = new AMapApi.Geocoder();
    }

    async function initMap(event) {
      event?.preventDefault();
      const provider = selectedProvider();
      const config = providers[provider];
      const key = apiKeyInput.value.trim();

      if (!key) {
        setStatus(`缺少${config.label} Key，地图未加载。`);
        return;
      }

      loadMapBtn.disabled = true;
      setStatus(`正在加载${config.label}。`);

      try {
        resetMap();
        currentKey = key;
        rememberRuntimeValues(provider, key);

        if (provider === "tencent") {
          await loadTencentMap(key);
          createTencentMap();
        } else {
          await loadAmap(key);
          createAmap();
        }

        loadedProvider = provider;
        locateBtn.disabled = false;
        setStatus(`${config.label}已加载，点击“定位到我”开始获取当前位置。`);
      } catch (error) {
        setStatus(`${config.label}加载失败：${error.message}。`);
      } finally {
        loadMapBtn.disabled = false;
      }
    }

    function requestJsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName = `mapCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          output: "jsonp",
          callback: callbackName,
        });

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("网络请求失败"));
        };

        script.src = `${url}?${query}`;
        document.body.appendChild(script);
      });
    }

    function updateTencentMarker(latitude, longitude) {
      const position = new TMap.LatLng(latitude, longitude);
      marker.setGeometries([
        {
          id: "current-location",
          position,
        },
      ]);
      map.setCenter(position);
      map.setZoom(16);
    }

    function updateAmapMarker(latitude, longitude) {
      const position = [longitude, latitude];
      marker.setPosition(position);
      marker.show();
      map.setCenter(position);
      map.setZoom(16);
    }

    async function reverseGeocodeWithTencent(latitude, longitude) {
      const data = await requestJsonp("https://apis.map.qq.com/ws/geocoder/v1/", {
        location: `${latitude},${longitude}`,
        key: currentKey,
        get_poi: "0",
      });

      if (data.status !== 0) {
        throw new Error(data.message || "逆地址解析失败");
      }

      return data.result.address;
    }

    function reverseGeocodeWithAmap(latitude, longitude) {
      return new Promise((resolve, reject) => {
        geocoder.getAddress([longitude, latitude], (status, result) => {
          if (status === "complete" && result.regeocode) {
            resolve(result.regeocode.formattedAddress);
            return;
          }

          reject(new Error(result?.info || "逆地址解析失败"));
        });
      });
    }

    async function reverseGeocode(latitude, longitude) {
      if (loadedProvider === "tencent") {
        return reverseGeocodeWithTencent(latitude, longitude);
      }

      return reverseGeocodeWithAmap(latitude, longitude);
    }

    function updateMarker(latitude, longitude) {
      if (loadedProvider === "tencent") {
        updateTencentMarker(latitude, longitude);
        return;
      }

      updateAmapMarker(latitude, longitude);
    }

    function getBestPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("当前浏览器不支持定位能力"));
          return;
        }

        let bestPosition = null;
        let sampleCount = 0;
        let lastError = null;
        let settled = false;
        let watchId = null;

        function isBetterPosition(position) {
          const bestAccuracy = bestPosition?.coords?.accuracy;
          const nextAccuracy = position?.coords?.accuracy;
          return !bestPosition || !Number.isFinite(bestAccuracy) || nextAccuracy < bestAccuracy;
        }

        function cleanup() {
          if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
          }
          window.clearTimeout(timeoutId);
        }

        function finish() {
          if (settled) {
            return;
          }

          settled = true;
          cleanup();

          if (bestPosition) {
            resolve({
              position: bestPosition,
              samples: sampleCount,
            });
            return;
          }

          reject(lastError || new Error("无法获取当前位置"));
        }

        const timeoutId = window.setTimeout(finish, LOCATION_TIMEOUT_MS);

        watchId = navigator.geolocation.watchPosition(
          (position) => {
            sampleCount += 1;

            if (isBetterPosition(position)) {
              bestPosition = position;
            }

            const accuracy = bestPosition.coords.accuracy;
            setStatus(`正在高精度定位：已采样 ${sampleCount} 次，当前最佳误差约 ${formatAccuracy(accuracy)}。`);

            if (
              sampleCount >= MAX_LOCATION_SAMPLES ||
              (sampleCount >= 2 && Number.isFinite(accuracy) && accuracy <= TARGET_ACCURACY_METERS)
            ) {
              finish();
            }
          },
          (error) => {
            lastError = error;
            if (!bestPosition) {
              setStatus(`定位暂未成功：${error.message || "等待下一次定位结果"}。`);
            }
          },
          LOCATION_OPTIONS
        );
      });
    }

    async function applyLocationResult(locationResult, shouldReverseGeocode) {
      const { sourceCoords, samples } = locationResult;
      const mapCoords = getMapCoordinates(sourceCoords);
      lastLocationResult = locationResult;

      updateMarker(mapCoords.latitude, mapCoords.longitude);

      if (!shouldReverseGeocode) {
        setStatus(buildDiagnosticText(sourceCoords, mapCoords, samples));
        return;
      }

      setStatus(`${buildDiagnosticText(sourceCoords, mapCoords, samples)}。正在解析地址。`);

      try {
        const address = await reverseGeocode(mapCoords.latitude, mapCoords.longitude);
        setStatus(`已定位：${address}。${buildDiagnosticText(sourceCoords, mapCoords, samples)}。`);
      } catch (error) {
        setStatus(`已定位坐标，地址解析未完成：${error.message}。${buildDiagnosticText(sourceCoords, mapCoords, samples)}。`);
      }
    }

    async function locateMe() {
      if (!map || !marker) {
        setStatus("地图未加载，先加载地图。");
        return;
      }

      locateBtn.disabled = true;
      locateBtn.textContent = "定位中";
      setStatus("正在请求浏览器定位授权，并连续采样以选择最佳精度。");

      try {
        const { position, samples } = await getBestPosition();
        const { coords } = position;
        await applyLocationResult({
          samples,
          sourceCoords: {
            latitude: coords.latitude,
            longitude: coords.longitude,
            accuracy: coords.accuracy,
          },
        }, true);
      } catch (error) {
        setStatus(`定位失败：${error.message || "浏览器拒绝或无法获取当前位置"}。`);
      } finally {
        locateBtn.disabled = false;
        locateBtn.textContent = "定位到我";
      }
    }

    const params = queryParams();
    providerSelect.value = params.get("provider") || localStorage.getItem("map-demo-provider") || "tencent";
    coordinateModeSelect.value = initialCoordinateMode();
    syncProviderFields();

    if (apiKeyInput.value.trim()) {
      initMap();
    }

    providerSelect.addEventListener("change", () => {
      resetMap();
      syncProviderFields();
    });
    coordinateModeSelect.addEventListener("change", () => {
      if (lastLocationResult) {
        applyLocationResult(lastLocationResult, false);
      }
    });
    keyForm.addEventListener("submit", initMap);
    locateBtn.addEventListener("click", locateMe);
  </script>
</body>
</html>
