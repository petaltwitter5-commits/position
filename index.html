<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>腾讯地图定位示例</title>
  <script>
    window.TENCENT_MAP_KEY = "ZDJBZ-GXYCH-IVTDI-WYE4C-4UGBV-VRFK2";
  </script>
  <script src="https://map.qq.com/api/gljs?v=1.exp&key=ZDJBZ-GXYCH-IVTDI-WYE4C-4UGBV-VRFK2"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #dde3ef;
      box-shadow: 0 2px 12px rgb(22 34 51 / 8%);
      z-index: 2;
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    #status {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #516070;
      overflow-wrap: anywhere;
    }

    button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #1769e0;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: progress;
      opacity: .72;
    }

    #map {
      width: 100%;
      min-height: 520px;
      height: calc(100vh - 76px);
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
      }

      button {
        width: 100%;
      }

      #map {
        height: calc(100vh - 128px);
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>腾讯地图定位示例</h1>
      <p id="status">正在初始化地图。</p>
    </div>
    <button id="locateBtn" type="button">定位到我</button>
  </header>

  <main id="map" aria-label="腾讯地图"></main>

  <script>
    const fallbackCenter = new TMap.LatLng(39.98412, 116.30748);
    const map = new TMap.Map(document.getElementById("map"), {
      center: fallbackCenter,
      zoom: 13,
      pitch: 0,
      rotation: 0,
    });

    const marker = new TMap.MultiMarker({
      map,
      geometries: [],
    });

    const statusEl = document.getElementById("status");
    const locateBtn = document.getElementById("locateBtn");

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function updateMarker(position) {
      marker.setGeometries([
        {
          id: "current-location",
          position,
        },
      ]);
      map.setCenter(position);
      map.setZoom(16);
    }

    function requestJsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName = `qqMapCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          output: "jsonp",
          callback: callbackName,
        });

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("网络请求失败"));
        };

        script.src = `${url}?${query}`;
        document.body.appendChild(script);
      });
    }

    async function reverseGeocode(latitude, longitude) {
      const data = await requestJsonp("https://apis.map.qq.com/ws/geocoder/v1/", {
        location: `${latitude},${longitude}`,
        key: window.TENCENT_MAP_KEY,
        get_poi: "0",
      });

      if (data.status !== 0) {
        throw new Error(data.message || "逆地址解析失败");
      }

      return data.result.address;
    }

    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("当前浏览器不支持定位能力"));
          return;
        }

        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0,
        });
      });
    }

    async function locateMe() {
      locateBtn.disabled = true;
      setStatus("正在请求浏览器定位授权。");

      try {
        const { coords } = await getCurrentPosition();
        const position = new TMap.LatLng(coords.latitude, coords.longitude);
        updateMarker(position);

        setStatus(`已定位：纬度 ${coords.latitude.toFixed(6)}，经度 ${coords.longitude.toFixed(6)}。正在解析地址。`);

        try {
          const address = await reverseGeocode(coords.latitude, coords.longitude);
          setStatus(`已定位：${address}，纬度 ${coords.latitude.toFixed(6)}，经度 ${coords.longitude.toFixed(6)}。`);
        } catch (error) {
          setStatus(`已定位坐标，地址解析未完成：${error.message}。`);
        }
      } catch (error) {
        setStatus(`定位失败：${error.message || "浏览器拒绝或无法获取当前位置"}。`);
      } finally {
        locateBtn.disabled = false;
      }
    }

    locateBtn.addEventListener("click", locateMe);
    setStatus("地图已加载，点击“定位到我”开始获取当前位置。");
  </script>
</body>
</html>
