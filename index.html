<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地图定位示例</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #dde3ef;
      box-shadow: 0 2px 12px rgb(22 34 51 / 8%);
      z-index: 2;
    }

    .title {
      min-width: 0;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    #status {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #516070;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    select,
    input {
      height: 38px;
      border: 1px solid #c9d3e2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #172033;
      background: #ffffff;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgb(23 105 224 / 14%);
    }

    select {
      width: 118px;
    }

    input {
      width: min(300px, 28vw);
    }

    .hidden {
      display: none;
    }

    button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #1769e0;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #edf2f8;
      color: #1f2d3d;
    }

    button:disabled {
      cursor: progress;
      opacity: .72;
    }

    #map {
      width: 100%;
      min-height: 520px;
      height: calc(100vh - 76px);
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      select,
      input,
      button {
        width: 100%;
      }

      #map {
        height: calc(100vh - 220px);
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1>地图定位示例</h1>
      <p id="status">选择地图服务并输入运行时 Key 后加载地图。</p>
    </div>
    <form class="controls" id="keyForm">
      <select id="providerSelect" aria-label="地图服务">
        <option value="tencent">腾讯地图</option>
        <option value="amap">高德地图</option>
      </select>
      <input id="apiKeyInput" type="text" autocomplete="off" placeholder="地图 Key">
      <input class="hidden" id="amapSecurityInput" type="text" autocomplete="off" placeholder="高德安全密钥，可选">
      <button class="secondary" id="loadMapBtn" type="submit">加载地图</button>
      <button id="locateBtn" type="button" disabled>定位到我</button>
    </form>
  </header>

  <main id="map" aria-label="地图"></main>

  <script>
    const fallbackCenter = { latitude: 39.98412, longitude: 116.30748 };
    const keyForm = document.getElementById("keyForm");
    const providerSelect = document.getElementById("providerSelect");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const amapSecurityInput = document.getElementById("amapSecurityInput");
    const loadMapBtn = document.getElementById("loadMapBtn");
    const statusEl = document.getElementById("status");
    const locateBtn = document.getElementById("locateBtn");
    const mapEl = document.getElementById("map");

    let map = null;
    let marker = null;
    let geocoder = null;
    let loadedProvider = "";
    let currentKey = "";

    const providers = {
      tencent: {
        label: "腾讯地图",
        keyStorage: "tencent-map-demo-key",
        placeholder: "腾讯地图 Key",
      },
      amap: {
        label: "高德地图",
        keyStorage: "amap-map-demo-key",
        securityStorage: "amap-map-demo-security",
        placeholder: "高德地图 JS API Key",
      },
    };

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function selectedProvider() {
      return providerSelect.value;
    }

    function queryParams() {
      return new URLSearchParams(window.location.search);
    }

    function scriptExists(id) {
      return Boolean(document.getElementById(id));
    }

    function loadScript(id, src) {
      return new Promise((resolve, reject) => {
        if (scriptExists(id)) {
          resolve();
          return;
        }

        const script = document.createElement("script");
        script.id = id;
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("地图脚本加载失败"));
        document.head.appendChild(script);
      });
    }

    function getRuntimeKey(provider) {
      const params = queryParams();
      const queryKey = params.get(`${provider}Key`) || params.get("key");
      return queryKey || localStorage.getItem(providers[provider].keyStorage) || "";
    }

    function getAmapSecurityCode() {
      const params = queryParams();
      return params.get("amapSecurityJsCode") || localStorage.getItem(providers.amap.securityStorage) || "";
    }

    function syncProviderFields() {
      const provider = selectedProvider();
      const config = providers[provider];
      apiKeyInput.placeholder = config.placeholder;
      apiKeyInput.value = getRuntimeKey(provider);
      amapSecurityInput.classList.toggle("hidden", provider !== "amap");
      amapSecurityInput.value = provider === "amap" ? getAmapSecurityCode() : "";
      locateBtn.disabled = true;
      setStatus(`输入${config.label} Key 后加载地图。`);
    }

    function resetMap() {
      if (map && typeof map.destroy === "function") {
        map.destroy();
      }

      map = null;
      marker = null;
      geocoder = null;
      mapEl.innerHTML = "";
      locateBtn.disabled = true;
      loadedProvider = "";
    }

    function rememberRuntimeValues(provider, key) {
      localStorage.setItem("map-demo-provider", provider);
      localStorage.setItem(providers[provider].keyStorage, key);

      if (provider === "amap") {
        const securityCode = amapSecurityInput.value.trim();
        if (securityCode) {
          localStorage.setItem(providers.amap.securityStorage, securityCode);
        }
      }
    }

    async function loadTencentMap(key) {
      await loadScript(
        "tencent-map-js",
        `https://map.qq.com/api/gljs?v=1.exp&key=${encodeURIComponent(key)}`
      );
    }

    async function loadAmap(key) {
      const securityCode = amapSecurityInput.value.trim();
      if (securityCode) {
        window._AMapSecurityConfig = { securityJsCode: securityCode };
      }

      await loadScript(
        "amap-js",
        `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(key)}&plugin=AMap.Geocoder`
      );
    }

    function createTencentMap() {
      const center = new TMap.LatLng(fallbackCenter.latitude, fallbackCenter.longitude);
      map = new TMap.Map(mapEl, {
        center,
        zoom: 13,
        pitch: 0,
        rotation: 0,
      });

      marker = new TMap.MultiMarker({
        map,
        geometries: [],
      });
    }

    function createAmap() {
      const center = [fallbackCenter.longitude, fallbackCenter.latitude];
      map = new AMap.Map("map", {
        center,
        zoom: 13,
        resizeEnable: true,
      });

      marker = new AMap.Marker({
        position: center,
      });
      map.add(marker);
      marker.hide();
      geocoder = new AMap.Geocoder();
    }

    async function initMap(event) {
      event?.preventDefault();
      const provider = selectedProvider();
      const config = providers[provider];
      const key = apiKeyInput.value.trim();

      if (!key) {
        setStatus(`缺少${config.label} Key，地图未加载。`);
        return;
      }

      loadMapBtn.disabled = true;
      setStatus(`正在加载${config.label}。`);

      try {
        resetMap();
        currentKey = key;
        rememberRuntimeValues(provider, key);

        if (provider === "tencent") {
          await loadTencentMap(key);
          createTencentMap();
        } else {
          await loadAmap(key);
          createAmap();
        }

        loadedProvider = provider;
        locateBtn.disabled = false;
        setStatus(`${config.label}已加载，点击“定位到我”开始获取当前位置。`);
      } catch (error) {
        setStatus(`${config.label}加载失败：${error.message}。`);
      } finally {
        loadMapBtn.disabled = false;
      }
    }

    function requestJsonp(url, params) {
      return new Promise((resolve, reject) => {
        const callbackName = `mapCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const script = document.createElement("script");
        const query = new URLSearchParams({
          ...params,
          output: "jsonp",
          callback: callbackName,
        });

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("网络请求失败"));
        };

        script.src = `${url}?${query}`;
        document.body.appendChild(script);
      });
    }

    function updateTencentMarker(latitude, longitude) {
      const position = new TMap.LatLng(latitude, longitude);
      marker.setGeometries([
        {
          id: "current-location",
          position,
        },
      ]);
      map.setCenter(position);
      map.setZoom(16);
    }

    function updateAmapMarker(latitude, longitude) {
      const position = [longitude, latitude];
      marker.setPosition(position);
      marker.show();
      map.setCenter(position);
      map.setZoom(16);
    }

    async function reverseGeocodeWithTencent(latitude, longitude) {
      const data = await requestJsonp("https://apis.map.qq.com/ws/geocoder/v1/", {
        location: `${latitude},${longitude}`,
        key: currentKey,
        get_poi: "0",
      });

      if (data.status !== 0) {
        throw new Error(data.message || "逆地址解析失败");
      }

      return data.result.address;
    }

    function reverseGeocodeWithAmap(latitude, longitude) {
      return new Promise((resolve, reject) => {
        geocoder.getAddress([longitude, latitude], (status, result) => {
          if (status === "complete" && result.regeocode) {
            resolve(result.regeocode.formattedAddress);
            return;
          }

          reject(new Error(result?.info || "逆地址解析失败"));
        });
      });
    }

    async function reverseGeocode(latitude, longitude) {
      if (loadedProvider === "tencent") {
        return reverseGeocodeWithTencent(latitude, longitude);
      }

      return reverseGeocodeWithAmap(latitude, longitude);
    }

    function updateMarker(latitude, longitude) {
      if (loadedProvider === "tencent") {
        updateTencentMarker(latitude, longitude);
        return;
      }

      updateAmapMarker(latitude, longitude);
    }

    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("当前浏览器不支持定位能力"));
          return;
        }

        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0,
        });
      });
    }

    async function locateMe() {
      if (!map || !marker) {
        setStatus("地图未加载，先加载地图。");
        return;
      }

      locateBtn.disabled = true;
      setStatus("正在请求浏览器定位授权。");

      try {
        const { coords } = await getCurrentPosition();
        updateMarker(coords.latitude, coords.longitude);
        setStatus(`已定位：纬度 ${coords.latitude.toFixed(6)}，经度 ${coords.longitude.toFixed(6)}。正在解析地址。`);

        try {
          const address = await reverseGeocode(coords.latitude, coords.longitude);
          setStatus(`已定位：${address}，纬度 ${coords.latitude.toFixed(6)}，经度 ${coords.longitude.toFixed(6)}。`);
        } catch (error) {
          setStatus(`已定位坐标，地址解析未完成：${error.message}。`);
        }
      } catch (error) {
        setStatus(`定位失败：${error.message || "浏览器拒绝或无法获取当前位置"}。`);
      } finally {
        locateBtn.disabled = false;
      }
    }

    const params = queryParams();
    providerSelect.value = params.get("provider") || localStorage.getItem("map-demo-provider") || "tencent";
    syncProviderFields();

    if (apiKeyInput.value.trim()) {
      initMap();
    }

    providerSelect.addEventListener("change", () => {
      resetMap();
      syncProviderFields();
    });
    keyForm.addEventListener("submit", initMap);
    locateBtn.addEventListener("click", locateMe);
  </script>
</body>
</html>
